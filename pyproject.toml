[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "focusguard"
version = "0.1.0"
description = "Persönlicher Fokus-Wächter gegen Prokrastination (Prototyp)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1,<3",
    "PySide6-Essentials>=6.12,<7",
    "mediapipe>=1.1,<2",
    "opencv-contrib-python>=4.10",
    "numpy",
    "mss>=10",
    "psutil>=7",
    "pywin32>=312; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["focusguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
